<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土族乐坊 · 彩虹故乡在线听歌</title>
<style>
  :root {
    --red:#c23b2e; --yellow:#dfa03a; --blue:#2e6da8; --white:#faf6ee;
    --black:#2a211c; --purple:#7e5aa0; --green:#4a8b5c;
    --paper:#f4efe4; --paper2:#efe8d8; --line:#ddd0b8;
    --ink:#3a2f26; --ink-soft:#7a6a58; --wood:#5c4026;
    --shadow:0 2px 10px rgba(42,33,28,.10); --shadow-lg:0 8px 28px rgba(42,33,28,.18);
    --r:12px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif; background:var(--paper); color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; }
  .serif { font-family:"Songti SC","Noto Serif SC","SimSun",serif; }
  svg { display:block; }
  button { font-family:inherit; }

  .app { display:flex; flex-direction:column; height:100vh; }

  /* ===== 顶部导航 ===== */
  .topbar { display:flex; align-items:center; gap:20px; height:64px; padding:0 24px; background:linear-gradient(180deg,#fffdf7,var(--paper)); border-bottom:2px solid var(--line); z-index:5; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand .sun { width:38px; height:38px; animation:spin 18s linear infinite; }
  .brand .name { font-family:"Songti SC","Noto Serif SC",serif; font-size:21px; font-weight:700; color:var(--black); letter-spacing:2px; }
  .brand .name b { color:var(--red); }
  .brand .sub { font-size:10px; color:var(--ink-soft); letter-spacing:1px; margin-top:-2px; }
  .rainbow { display:flex; height:18px; border-radius:2px; overflow:hidden; align-self:center; }
  .rainbow i { width:22px; height:100%; }
  .nav { display:flex; gap:4px; }
  .nav button { border:none; background:none; cursor:pointer; font-size:15px; color:var(--ink-soft); padding:8px 16px; border-radius:8px; transition:all .18s; }
  .nav button:hover { color:var(--black); background:var(--paper2); }
  .nav button.on { color:#fff; background:var(--red); font-weight:600; box-shadow:var(--shadow); }
  .search { margin-left:auto; position:relative; }
  .search input { width:260px; height:38px; border:1.5px solid var(--line); border-radius:20px; padding:0 16px 0 38px; font-size:14px; background:#fff; color:var(--ink); outline:none; transition:all .18s; }
  .search input:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(194,59,46,.10); width:300px; }
  .search .ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:.5; }
  .search .hint { position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ink-soft); opacity:.6; }

  /* ===== 主体 ===== */
  .main { flex:1; display:flex; min-height:0; }
  .sidebar { width:240px; flex-shrink:0; padding:18px 12px; background:linear-gradient(180deg,#fffdf7,var(--paper2)); border-right:2px solid var(--line); overflow-y:auto; }
  .sidebar h3 { font-family:"Songti SC",serif; font-size:13px; color:var(--ink-soft); letter-spacing:2px; margin:4px 8px 10px; }
  .plist { list-style:none; }
  .plist li { display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:4px; border-radius:10px; cursor:pointer; transition:all .16s; font-size:14px; color:var(--ink); }
  .plist li:hover { background:rgba(194,59,46,.07); }
  .plist li.on { background:var(--red); color:#fff; box-shadow:var(--shadow); font-weight:600; }
  .plist li .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 1px 2px rgba(0,0,0,.2); }
  .plist li .cnt { margin-left:auto; font-size:12px; opacity:.65; }
  .content { flex:1; overflow-y:auto; padding:22px 26px 120px; }

  .carousel { position:relative; height:220px; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-lg); margin-bottom:26px; }
  .carousel .slide { position:absolute; inset:0; opacity:0; transition:opacity .7s; display:flex; align-items:center; padding:0 48px; cursor:pointer; }
  .carousel .slide.on { opacity:1; }
  .carousel .slide .tx { color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.35); }
  .carousel .slide .tag { display:inline-block; font-size:12px; padding:3px 12px; border-radius:12px; background:rgba(255,255,255,.22); backdrop-filter:blur(4px); margin-bottom:12px; letter-spacing:2px; }
  .carousel .slide h2 { font-family:"Songti SC",serif; font-size:34px; font-weight:700; letter-spacing:2px; margin-bottom:8px; }
  .carousel .slide p { font-size:14px; opacity:.9; max-width:420px; line-height:1.7; }
  .carousel .slide .deco { position:absolute; right:40px; opacity:.9; }
  .carousel .arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; background:rgba(255,255,255,.28); backdrop-filter:blur(4px); color:#fff; font-size:18px; transition:all .18s; display:flex; align-items:center; justify-content:center; }
  .carousel .arrow:hover { background:rgba(255,255,255,.5); }
  .carousel .arrow.l { left:12px; } .carousel .arrow.r { right:12px; }
  .carousel .dots { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:3; }
  .carousel .dots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.45); cursor:pointer; transition:all .2s; }
  .carousel .dots i.on { width:22px; border-radius:4px; background:#fff; }

  .sec-head { display:flex; align-items:baseline; gap:12px; margin:6px 0 16px; }
  .sec-head h2 { font-family:"Songti SC",serif; font-size:21px; color:var(--black); letter-spacing:1px; }
  .sec-head .bar { flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
  .sec-head .more { font-size:13px; color:var(--ink-soft); }
  .sec-head .tag { font-size:12px; padding:2px 10px; border-radius:10px; border:1px solid currentColor; letter-spacing:1px; }

  .rank { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .rank-card { display:flex; align-items:center; gap:12px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:all .16s; box-shadow:0 1px 3px rgba(42,33,28,.05); }
  .rank-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--yellow); }
  .rank-card .no { font-family:"Songti SC",serif; font-size:22px; font-weight:700; width:32px; text-align:center; color:var(--ink-soft); flex-shrink:0; }
  .rank-card:nth-child(1) .no { color:var(--red); } .rank-card:nth-child(2) .no { color:var(--yellow); } .rank-card:nth-child(3) .no { color:var(--blue); }
  .rank-card .cover { width:46px; height:46px; border-radius:8px; flex-shrink:0; }
  .rank-card .info { min-width:0; }
  .rank-card .info .n { font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-card .info .s { font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-card .play { margin-left:auto; width:30px; height:30px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .16s; flex-shrink:0; }
  .rank-card:hover .play { opacity:1; }

  .songlist { background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); }
  .songlist .head { display:grid; grid-template-columns:46px 1fr 160px 90px; padding:10px 16px; background:var(--paper2); font-size:12px; color:var(--ink-soft); letter-spacing:1px; border-bottom:1px solid var(--line); }
  .songlist .row { display:grid; grid-template-columns:46px 1fr 160px 90px; padding:11px 16px; cursor:pointer; align-items:center; transition:background .14s; border-bottom:1px solid #f0e9da; }
  .songlist .row:last-child { border-bottom:none; }
  .songlist .row:hover { background:#fbf5ea; }
  .songlist .row.playing { background:#fdf1e9; }
  .songlist .row .idx { font-family:"Songti SC",serif; color:var(--ink-soft); font-size:14px; }
  .songlist .row.playing .idx { color:var(--red); font-weight:700; }
  .songlist .row .tt { min-width:0; }
  .songlist .row .tt .n { font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .songlist .row.playing .tt .n { color:var(--red); }
  .songlist .row .tt .cat { font-size:11px; color:var(--blue); margin-top:1px; }
  .songlist .row .s { font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .songlist .row .d { font-size:12px; color:var(--ink-soft); text-align:right; }
  .empty { padding:40px; text-align:center; color:var(--ink-soft); font-size:14px; }
  .empty b { color:var(--red); }
  .loading { padding:60px; text-align:center; color:var(--ink-soft); }
  .loading .spin-sun { width:48px; height:48px; margin:0 auto 14px; animation:spin 2s linear infinite; }

  .about { background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:24px 26px; box-shadow:var(--shadow); }
  .about .lead { font-size:15px; color:var(--ink); line-height:1.95; margin:0 0 18px; }
  .about .lead b { color:var(--red); }
  .about .cats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0; }
  .about .catcard { border:1px solid var(--line); border-radius:10px; padding:16px 16px 14px; border-top:3px solid var(--c); background:#fdfbf5; }
  .about .catcard h4 { font-family:"Songti SC","Noto Serif SC",serif; font-size:16px; color:var(--c); margin-bottom:9px; display:flex; align-items:center; gap:9px; letter-spacing:1px; }
  .about .catcard h4 svg { width:22px; height:22px; flex-shrink:0; animation:spin 14s linear infinite; }
  .about .catcard p { font-size:13px; color:var(--ink-soft); line-height:1.75; margin:0; }
  .about .foot { font-size:13px; color:var(--ink-soft); line-height:1.85; margin:0; border-top:1px dashed var(--line); padding-top:15px; }

  /* ===== 底部播放条 ===== */
  .player { position:fixed; left:0; right:0; bottom:0; height:82px; z-index:10; background:linear-gradient(180deg,#fffdf7,#f6f0e3); border-top:2px solid var(--line); display:flex; align-items:center; gap:16px; padding:0 22px; box-shadow:0 -4px 20px rgba(42,33,28,.08); }
  .player .pcover { width:54px; height:54px; border-radius:10px; flex-shrink:0; cursor:pointer; }
  .player .pcover.spin { animation:spin 8s linear infinite; }
  .player .pinfo { width:200px; min-width:0; cursor:pointer; }
  .player .pinfo .n { font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .player .pinfo .s { font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .player .ctrl { display:flex; align-items:center; gap:18px; }
  .player .btn { border:none; background:none; cursor:pointer; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .player .btn:hover { background:var(--paper2); }
  .player .btn svg { width:20px; height:20px; fill:var(--ink); }
  .player .btn.play { width:48px; height:48px; background:var(--red); box-shadow:0 4px 14px rgba(194,59,46,.4); }
  .player .btn.play:hover { background:#a8321f; }
  .player .btn.play svg { fill:#fff; width:22px; height:22px; }
  .player .progress { flex:1; display:flex; align-items:center; gap:12px; min-width:0; }
  .player .time { font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .track { flex:1; height:5px; background:var(--paper2); border-radius:3px; cursor:pointer; position:relative; }
  .track .fill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:3px; background:linear-gradient(90deg,var(--red),var(--yellow),var(--green)); }
  .track .knob { position:absolute; top:50%; left:0%; width:13px; height:13px; border-radius:50%; background:#fff; border:2px solid var(--red); transform:translate(-50%,-50%); box-shadow:var(--shadow); }
  .player .vol { display:flex; align-items:center; gap:8px; }
  .player .vol svg { width:18px; height:18px; fill:var(--ink-soft); }

  /* ===== 听歌页面 ===== */
  .nowplaying { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; background:linear-gradient(160deg,var(--np1),var(--np2)); }
  .nowplaying.show { display:flex; }
  .np-top { display:flex; align-items:center; gap:16px; padding:18px 24px; }
  .np-back { border:none; background:rgba(255,255,255,.18); color:#fff; width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .np-back:hover { background:rgba(255,255,255,.3); }
  .np-back svg { width:20px; height:20px; fill:#fff; }
  .np-top .t { color:#fff; font-size:14px; letter-spacing:2px; opacity:.9; }
  .np-top .t b { font-family:"Songti SC",serif; }
  .np-body { flex:1; display:flex; align-items:center; justify-content:center; gap:60px; padding:0 60px 40px; overflow:hidden; }
  .np-cover-wrap { position:relative; flex-shrink:0; }
  .np-cover { width:280px; height:280px; border-radius:50%; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .np-cover .disc { position:absolute; inset:0; border-radius:50%; animation:spin 12s linear infinite; }
  .np-cover .ring { position:absolute; inset:-14px; border-radius:50%; border:2px dashed rgba(255,255,255,.5); animation:spin 24s linear infinite reverse; }
  .np-cover .hole { position:absolute; top:50%; left:50%; width:22px; height:22px; border-radius:50%; background:#faf6ee; transform:translate(-50%,-50%); box-shadow:0 0 0 5px rgba(255,255,255,.25); z-index:2; }
  .np-side { color:#fff; max-width:420px; }
  .np-side .tag { display:inline-block; font-size:12px; padding:3px 12px; border-radius:12px; background:rgba(255,255,255,.22); letter-spacing:2px; margin-bottom:14px; }
  .np-side h1 { font-family:"Songti SC",serif; font-size:34px; font-weight:700; letter-spacing:1px; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,.25); }
  .np-side .singer { font-size:15px; opacity:.85; margin-bottom:26px; }
  .np-progress { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .np-progress .track { flex:1; height:6px; background:rgba(255,255,255,.3); }
  .np-progress .track .fill { background:#fff; }
  .np-progress .track .knob { border-color:#fff; background:var(--red); }
  .np-progress .time { color:#fff; font-size:12px; font-variant-numeric:tabular-nums; }
  .np-ctrl { display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:26px; }
  .np-ctrl button { border:none; background:none; cursor:pointer; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .np-ctrl button svg { width:22px; height:22px; fill:#fff; }
  .np-ctrl button:hover { background:rgba(255,255,255,.18); }
  .np-ctrl button.play { width:64px; height:64px; background:rgba(255,255,255,.9); box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .np-ctrl button.play:hover { background:#fff; }
  .np-ctrl button.play svg { fill:var(--red); width:28px; height:28px; }
  .np-ctrl button.loop.on { background:rgba(255,255,255,.28); }
  .np-lyric { font-family:"Songti SC",serif; font-size:15px; line-height:2.1; opacity:.75; text-align:center; min-height:64px; }

  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:900px) { .sidebar { width:190px; } .rank { grid-template-columns:1fr; } .search input { width:160px; } .about .cats { grid-template-columns:1fr; } .np-body { flex-direction:column; gap:30px; } .np-cover { width:200px; height:200px; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app" id="browse">
  <div class="topbar">
    <div class="brand" onclick="renderHome()">
      <svg class="sun" viewBox="0 0 100 100" id="logo-sun"></svg>
      <div>
        <div class="name">土族<b>乐坊</b></div>
        <div class="sub">彩虹故乡 · 在线听歌</div>
      </div>
    </div>
    <div class="rainbow">
      <i style="background:#c23b2e"></i><i style="background:#dfa03a"></i><i style="background:#2e6da8"></i>
      <i style="background:#faf6ee"></i><i style="background:#2a211c"></i><i style="background:#7e5aa0"></i><i style="background:#4a8b5c"></i>
    </div>
    <nav class="nav">
      <button class="on" data-nav="home" onclick="renderHome()">首页</button>
      <button data-nav="huaer" onclick="renderCat('huaer')">土族花儿</button>
      <button data-nav="anzhao" onclick="renderCat('anzhao')">安昭舞曲</button>
      <button data-nav="jiuge" onclick="renderCat('jiuge')">酩馏酒歌</button>
      <button data-nav="xushi" onclick="renderCat('xushi')">叙事长歌</button>
    </nav>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" fill="#3a2f26"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="text" placeholder="搜索土族民歌、花儿、安昭…" oninput="renderSearch(this.value)">
      <span class="hint" id="qstat"></span>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <h3>土族歌单</h3>
      <ul class="plist" id="plist"></ul>
    </aside>
    <section class="content" id="content"></section>
  </div>

  <div class="player">
    <div class="pcover" id="pcover" onclick="openNowPlaying()"></div>
    <div class="pinfo" onclick="openNowPlaying()">
      <div class="n" id="pname">还没有播放歌曲</div>
      <div class="s" id="psinger">点一首歌，听彩虹故乡的声音</div>
    </div>
    <div class="ctrl">
      <button class="btn" onclick="prev()" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="btn play" onclick="togglePlay()" aria-label="播放/暂停"><svg id="playico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="btn" onclick="next()" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="progress">
      <span class="time" id="cur">00:00</span>
      <div class="track" onmousedown="startSeek(event)"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <span class="time" id="dur">00:00</span>
    </div>
    <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg><div class="track" style="width:70px" onmousedown="startVol(event)"><div class="fill" style="width:100%"></div></div></div>
  </div>
</div>

<!-- ===== 听歌页面 ===== -->
<div class="nowplaying" id="nowplaying">
  <div class="np-top">
    <button class="np-back" onclick="closeNowPlaying()" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
    <span class="t"><b>土族乐坊</b> · 正在播放</span>
  </div>
  <div class="np-body">
    <div class="np-cover-wrap">
      <div class="np-cover">
        <div class="disc" id="npDisc"></div>
        <div class="ring"></div>
        <div class="hole"></div>
      </div>
    </div>
    <div class="np-side">
      <span class="tag" id="npTag">土族民歌</span>
      <h1 id="npName">—</h1>
      <div class="singer" id="npSinger">—</div>
      <div class="np-progress">
        <span class="time" id="npCur">00:00</span>
        <div class="track" onmousedown="startSeek(event)"><div class="fill" id="npFill"></div><div class="knob" id="npKnob"></div></div>
        <span class="time" id="npDur">00:00</span>
      </div>
      <div class="np-ctrl">
        <button class="loop" id="npLoop" onclick="toggleLoop()" aria-label="循环"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
        <button onclick="prev()" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="play" id="npPlay" onclick="togglePlay()" aria-label="播放/暂停"><svg id="npPlayIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button onclick="next()" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button class="loop" onclick="shufflePlay()" aria-label="随机"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      </div>
      <div class="np-lyric" id="npLyric">土族民歌 · 以土语演唱，唱的是高原上代代相传的心声</div>
    </div>
  </div>
</div>

<script>
/* ================= 数据 ================= */
let SONGS = [], SID = null, queue = [], curIdx = -1, loopMode = false, curCat = 'huaer';
const L7 = ['#c23b2e','#dfa03a','#2e6da8','#7e5aa0','#4a8b5c','#2a211c'];
const CATS = {
  huaer:  { name:'土族花儿',   cn:'花儿 · 少年',  color:'#c23b2e', desc:'高腔山歌，土族称「哈达过道」，六月六花儿会上对唱不绝' },
  anzhao: { name:'安昭舞曲',   cn:'安昭 · 歌舞',  color:'#2e6da8', desc:'手拉手围成圈，领唱相和，三拍子旋转歌舞' },
  jiuge:  { name:'酩馏酒歌',   cn:'宴席 · 酒歌',  color:'#dfa03a', desc:'青稞酿酩馏，宾主相敬，赞歌问答歌敬酒助兴' },
  xushi:  { name:'叙事长歌',   cn:'叙事 · 长歌',  color:'#7e5aa0', desc:'拉仁布与吉门索、祁家延西，老人吟诵的史诗' },
  yaolan: { name:'摇篮曲 · 儿歌', cn:'摇篮 · 童谣', color:'#4a8b5c', desc:'阿奇斯仁古玛、布柔哟，母亲唱给孩子的歌' },
  qiyue:  { name:'器乐 · 随想曲', cn:'器乐 · 管弦', color:'#5c4026', desc:'杨庶正《土族民歌主题随想曲》，中西合璧' },
  other:  { name:'民俗 · 影像', cn:'民俗 · 记录',  color:'#8b5a3c', desc:'安昭、轮子秋、婚礼与语言，土族生活的影像记录' },
};
function classify(name){
  const n = name || '';
  if(/随想曲|管弦|交响/.test(n)) return 'qiyue';
  if(/安昭|安召|梆梆|轮子秋/.test(n)) return 'anzhao';
  if(/敬酒|赞歌|赞媒|蛋酒|宴席|酩馏|垦荒|十报恩|酒歌/.test(n)) return 'jiuge';
  if(/拉仁布|吉门索|祁家延西|唐德格玛|太平|欢歌|叙事/.test(n)) return 'xushi';
  if(/摇篮|布柔|登登玛秀|阿且什戈玛|孩子|七彩袖|儿歌/.test(n)) return 'yaolan';
  if(/土族令|花儿令|土族花儿|白棉花|互助令|阴阳令|尕连手|喜连喜|巴依儿|尖加玛塞/.test(n)) return 'huaer';
  return 'other';
}
const audio = new Audio();
audio.preload = 'auto';

/* ================= SVG 纹样 ================= */
function sunFlower(color, petal, r, cx, cy){
  cx=cx||50; cy=cy||50; r=r||30; let p='';
  for(let i=0;i<petal;i++){ const a=i*360/petal;
    p += `<ellipse cx="${cx}" cy="${cy-r*0.8}" rx="${r*0.28}" ry="${r*0.55}" fill="${color}" opacity=".85" transform="rotate(${a} ${cx} ${cy})"/>`; }
  return `<circle cx="${cx}" cy="${cy}" r="${r*1.02}" fill="${color}" opacity=".14"/>${p}<circle cx="${cx}" cy="${cy}" r="${r*0.42}" fill="${color}" opacity=".92"/><circle cx="${cx}" cy="${cy}" r="${r*0.2}" fill="#faf6ee"/>`;
}
function coverSVG(color){
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="${color}" opacity=".12"/>${sunFlower(color,10,32)}</svg>`;
}
function logoSun(){
  let g='';
  for(let i=0;i<12;i++){ const a=i*30; g += `<ellipse cx="50" cy="20" rx="5" ry="12" fill="${L7[i%6]}" opacity=".9" transform="rotate(${a} 50 50)"/>`; }
  for(let i=0;i<6;i++){ const a=i*60; g += `<ellipse cx="50" cy="30" rx="4" ry="9" fill="${L7[(i+2)%6]}" opacity=".95" transform="rotate(${a} 50 50)"/>`; }
  g += `<circle cx="50" cy="50" r="14" fill="#c23b2e"/><circle cx="50" cy="50" r="7" fill="#dfa03a"/><circle cx="50" cy="50" r="3.5" fill="#faf6ee"/>`;
  return g;
}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(sec){ sec=Math.floor(sec||0); const m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function catOf(s){ return s._cat || classify(s.song_name); }

/* ================= 左侧歌单 ================= */
function buildSidebar(){
  const plist=$('#plist'); plist.innerHTML='';
  Object.entries(CATS).forEach(([k,c])=>{
    const n=SONGS.filter(s=>catOf(s)===k).length;
    if(!n) return;
    const li=document.createElement('li'); li.dataset.cat=k;
    li.innerHTML=`<span class="dot" style="background:${c.color}"></span><span>${c.name}</span><span class="cnt">${n}</span>`;
    li.onclick=()=>renderCat(k);
    plist.appendChild(li);
  });
}

/* ================= 渲染 ================= */
const SLIDES=[
  {cat:'jiuge', tag:'酩馏酒歌 · 宴席曲', h2:'一碗酩馏敬天地', p:'青稞酿的酩馏酒，配着赞歌与问答歌。土族人待客，歌声比酒更醇。', c:['#c23b2e','#dfa03a']},
  {cat:'huaer', tag:'土族花儿 · 六月六', h2:'花儿漫过日月山', p:'「哈达过道」——在山野田间唱的心上的话。尕连手令、白棉花令，音落处拖长下滑。', c:['#2e6da8','#7e5aa0']},
  {cat:'anzhao', tag:'安昭舞 · 转安昭', h2:'彩袖转成太阳花', p:'手拉手围成圆，领唱相和。七彩花袖衫转起来，像轮子秋上盛开的花。', c:['#4a8b5c','#2e6da8']},
  {cat:'xushi', tag:'叙事长歌 · 明珠', h2:'拉仁布与吉门索', p:'土族的「梁祝」，三百行悲歌。纳顿节上老人吟诵，听者泪流满面。', c:['#7e5aa0','#c23b2e']},
];
let slideIdx=0;
function carouselHTML(){
  return `<div class="carousel">
    ${SLIDES.map((s,i)=>`<div class="slide${i===0?' on':''}" style="background:linear-gradient(120deg,${s.c[0]},${s.c[1]})" onclick="renderCat('${s.cat}')">
      <div class="tx"><span class="tag">${s.tag}</span><h2 class="serif">${s.h2}</h2><p>${s.p}</p></div>
      <div class="deco"><svg width="150" height="150" viewBox="0 0 100 100">${sunFlower('rgba(255,255,255,.85)',12,30)}</svg></div>
    </div>`).join('')}
    <button class="arrow l" onclick="slideTo(-1)">‹</button><button class="arrow r" onclick="slideTo(1)">›</button>
    <div class="dots">${SLIDES.map((_,i)=>`<i class="${i===0?'on':''}" onclick="slideIdx=${i};paintSlide()"></i>`).join('')}</div></div>`;
}
function hotSongs(){ return SONGS.slice(0,10); }
function rankHTML(){
  const list=hotSongs();
  return `<div class="sec-head"><h2>土族热歌榜</h2><div class="bar"></div><span class="more">Top 10</span></div>
    <div class="rank">${list.map((s,i)=>`<div class="rank-card" onclick="playFrom(${SONGS.indexOf(s)})">
      <div class="no">${i+1}</div><div class="cover">${coverSVG(CATS[catOf(s)].color)}</div>
      <div class="info"><div class="n">${esc(s.song_name)}</div><div class="s">${esc(s.singers||'土族')} · ${CATS[catOf(s)].name}</div></div>
      <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
    </div>`).join('')}</div>`;
}
function aboutHTML(){
  const card=(c,t,d)=>`<div class="catcard" style="--c:${c}"><h4><svg viewBox="0 0 100 100">${sunFlower(c,8,26)}</svg>${t}</h4><p>${d}</p></div>`;
  return `<div class="sec-head"><h2>关于土族音乐</h2><div class="bar"></div><span class="tag" style="color:#c23b2e">彩虹的民族</span></div>
  <div class="about">
    <p class="lead">土族自称「蒙古尔」，世居青海互助、民和、大通等地，因妇女的<b>七彩花袖衫</b>而被称作「彩虹的民族」。土族没有自己的文字，历史、礼俗与心底的情感，都托付给了歌。</p>
    <div class="cats">
      ${card('#c23b2e','花儿 · 少年','土族称「哈达过道」，是山野田间的高腔山歌。尕连手令、好花儿令、白棉花令（互助令）等曲令，旋律高亢悠长，句尾拖腔缓慢下滑。')}
      ${card('#2e6da8','安昭 · 歌舞','土族最具特色的圈舞。手拉手围成圆圈旋转歌舞，三拍子，领唱短促、合唱悠长，衬句「安昭索罗罗」由此得名。')}
      ${card('#dfa03a','宴席曲 · 酒歌','宴席上宾主互敬的赞歌、问答歌与婚礼曲「道拉」，如《唐德格玛》《纳信妥诺》《依姐》，配着青稞酿的酩馏酒助兴。')}
    </div>
    <p class="foot">另有叙事长歌《拉仁布与吉门索》（土族的「梁祝」）、《祁家延西》，以及《布柔哟》《登登玛秀》《阿且什戈玛》等摇篮曲与儿歌。音乐多用五声、六声音阶，以四度五度作调式骨架，节拍以三拍子为主，花儿善用八度跳进。</p>
  </div>`;
}
function renderHome(){
  slideIdx=0;
  if(!SONGS.length){ $('#content').innerHTML='<div class="loading"><div class="spin-sun"><svg viewBox="0 0 100 100">'+sunFlower('#c23b2e',10,34)+'</svg></div>正在加载土族曲库…</div>'; return; }
  $('#content').innerHTML = carouselHTML() + rankHTML() + aboutHTML();
  setNav('home'); setActiveLi(null);
}
function renderCat(k){
  const c=CATS[k], list=SONGS.filter(s=>catOf(s)===k);
  curCat=k;
  $('#content').innerHTML = `
    <div class="sec-head"><h2>${c.name}</h2><span class="tag" style="color:${c.color}">${c.cn}</span><div class="bar"></div><span class="more">共 ${list.length} 首</span></div>
    <p style="color:#7a6a58;font-size:14px;margin:0 0 16px">${c.desc}</p>
    <div class="songlist">
      <div class="head"><span>#</span><span>歌曲</span><span>歌手</span><span>时长</span></div>
      ${list.map((s,i)=>`<div class="row" data-idx="${SONGS.indexOf(s)}" onclick="playFrom(${SONGS.indexOf(s)})">
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="tt"><span class="n">${esc(s.song_name)}</span><br><span class="cat">${c.name}</span></span>
        <span class="s">${esc(s.singers||'土族')}</span><span class="d">${fmt(s.duration_s)}</span>
      </div>`).join('')}
    </div>`;
  setActiveLi(document.querySelector(`.plist li[data-cat="${k}"]`));
}
function renderSearch(q){
  q=(q||'').trim(); $('#qstat').textContent = q?'…':'';
  if(!q){ renderHome(); return; }
  const r=SONGS.filter(s=>(s.song_name||'').includes(q)||(s.singers||'').includes(q)||CATS[catOf(s)].name.includes(q));
  $('#qstat').textContent=r.length+' 首';
  $('#content').innerHTML = `
    <div class="sec-head"><h2>搜索「${esc(q)}」</h2><div class="bar"></div><span class="more">${r.length} 首</span></div>
    ${r.length?`<div class="songlist">
      <div class="head"><span>#</span><span>歌曲</span><span>歌手</span><span>时长</span></div>
      ${r.map((s,i)=>`<div class="row" onclick="playFrom(${SONGS.indexOf(s)})">
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="tt"><span class="n">${esc(s.song_name)}</span><br><span class="cat">${CATS[catOf(s)].name}</span></span>
        <span class="s">${esc(s.singers||'土族')}</span><span class="d">${fmt(s.duration_s)}</span>
      </div>`).join('')}
    </div>`:`<div class="empty">没有找到「<b>${esc(q)}</b>」相关的歌，换个词试试</div>`}`;
  setNav(null); setActiveLi(null);
}
function setNav(key){ document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.nav===key)); }
function setActiveLi(li){ document.querySelectorAll('.plist li').forEach(x=>x.classList.remove('on')); if(li) li.classList.add('on'); }
function paintSlide(){ const c=document.querySelector('#content .carousel'); if(!c) return; c.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===slideIdx)); c.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===slideIdx)); }
function slideTo(dir){ const c=document.querySelector('#content .carousel'); if(!c) return; slideIdx=(slideIdx+dir+SLIDES.length)%SLIDES.length; paintSlide(); }

/* ================= 播放 ================= */
function playFrom(i){ queue = SONGS.slice(); curIdx = i; loadCur(); }
function previewURL(s){
  return '/api/preview?sid=' + encodeURIComponent(SID||'') + '&id=' + encodeURIComponent(s.id||'') + '&n=' + encodeURIComponent(s.song_name||'') + '&s=' + encodeURIComponent(s.singers||'') + '&src=' + encodeURIComponent(s.source||'');
}
function loadCur(){
  const s=queue[curIdx]; if(!s) return;
  const c=CATS[catOf(s)];
  $('#pname').textContent=s.song_name; $('#psinger').textContent=(s.singers||'土族')+' · '+c.name;
  $('#pcover').innerHTML=coverSVG(c.color); $('#dur').textContent=fmt(s.duration_s);
  $('#cur').textContent='00:00'; $('#fill').style.width='0%'; $('#knob').style.left='0%';
  // 听歌页面同步
  $('#npName').textContent=s.song_name; $('#npSinger').textContent=(s.singers||'土族')+' · '+c.name;
  $('#npTag').textContent=c.name; $('#npDur').textContent=fmt(s.duration_s);
  $('#npDisc').innerHTML=coverSVG(c.color);
  $('#nowplaying').style.setProperty('--np1', c.color); $('#nowplaying').style.setProperty('--np2', mixToDark(c.color));
  $('#npLyric').textContent = LYRIC_HINT[catOf(s)] || '土族民歌 · 以土语演唱，唱的是高原上代代相传的心声';
  audio.src = previewURL(s);
  audio.dataset.retried='';
  audio.play().then(()=>setPlay(true)).catch(()=>{});
  markPlaying();
}
function mixToDark(hex){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*.25); g=Math.round(g*.2); b=Math.round(b*.28);
  return 'rgb('+r+','+g+','+b+')';
}
function setPlay(p){
  const ico=p?'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>':'<path d="M8 5v14l11-7z"/>';
  $('#playico').innerHTML=ico; $('#npPlayIco').innerHTML=ico;
  $('#pcover').classList.toggle('spin',p);
}
function markPlaying(){
  document.querySelectorAll('.songlist .row').forEach(r=>r.classList.remove('playing'));
  const rows=document.querySelectorAll('.songlist .row');
  rows.forEach(r=>{ if(r.dataset.idx==String(curIdx)) r.classList.add('playing'); });
}
function togglePlay(){
  if(!queue.length){ if(SONGS.length) playFrom(0); return; }
  if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
}
function next(){ if(queue.length){ curIdx=(curIdx+1)%queue.length; loadCur(); } }
function prev(){ if(queue.length){ curIdx=(curIdx-1+queue.length)%queue.length; loadCur(); } }
function shufflePlay(){ if(!SONGS.length) return; queue=SONGS.slice().sort(()=>Math.random()-0.5); curIdx=0; loadCur(); }
function toggleLoop(){ loopMode=!loopMode; $('#npLoop').classList.toggle('on',loopMode); }
/* 进度条 / 音量条 拖拽（mousedown 起拖 + 全局 mousemove/mouseup） */
let dragEl = null, dragKind = null;
function startSeek(e){ dragEl = e.currentTarget; dragKind = 'seek'; applyDrag(e); e.preventDefault(); }
function startVol(e){ dragEl = e.currentTarget; dragKind = 'vol'; applyDrag(e); e.preventDefault(); }
document.addEventListener('mousemove', e => { if(dragEl) applyDrag(e); });
document.addEventListener('mouseup', () => { dragEl = null; dragKind = null; });
function applyDrag(e){
  const r = dragEl.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if(dragKind === 'seek'){
    if(audio.duration && isFinite(audio.duration)) audio.currentTime = pct * audio.duration;
    setProgressUI(pct);
  } else {
    audio.volume = pct;
    dragEl.querySelector('.fill').style.width = (pct * 100) + '%';
  }
}
function setProgressUI(pct){
  $('#fill').style.width = pct + '%'; $('#knob').style.left = pct + '%';
  $('#npFill').style.width = pct + '%'; $('#npKnob').style.left = pct + '%';
  const total = (audio.duration && isFinite(audio.duration)) ? audio.duration : ((queue[curIdx] || {}).duration_s || 0);
  if(total){ const t = fmt(total * pct); $('#cur').textContent = t; $('#npCur').textContent = t; }
}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return; const pct=(audio.currentTime/audio.duration)*100;
  $('#fill').style.width=pct+'%'; $('#knob').style.left=pct+'%';
  $('#npFill').style.width=pct+'%'; $('#npKnob').style.left=pct+'%';
  const t=fmt(audio.currentTime); $('#cur').textContent=t; $('#npCur').textContent=t;
});
audio.addEventListener('playing',()=>setPlay(true));
audio.addEventListener('pause',()=>setPlay(false));
audio.addEventListener('ended',()=>{ if(loopMode) audio.play(); else next(); });
audio.addEventListener('error',()=>{
  if(audio.src && !audio.dataset.retried){ audio.dataset.retried='1'; const s=queue[curIdx]; if(s){ audio.src=previewURL(s); audio.play().catch(()=>{}); } }
});

/* ================= 听歌页面 ================= */
function openNowPlaying(){ if(curIdx<0) return; $('#nowplaying').classList.add('show'); }
function closeNowPlaying(){ $('#nowplaying').classList.remove('show'); }

/* ================= 歌词占位 ================= */
const LYRIC_HINT = {
  huaer:'花儿本是心上的话，\n不唱由不得自家。\n——土族花儿 · 尕连手令',
  anzhao:'安昭索罗罗，\n彩袖转起来，圈成太阳花。',
  jiuge:'一碗酩馏敬天地，\n赞歌问答敬宾朋。',
  xushi:'拉仁布在山上放羊，\n吉门索在山下背水。',
  yaolan:'阿奇斯仁古玛，\n摇篮里的彩虹故乡。',
  qiyue:'杨庶正 · 土族民歌主题随想曲\n中西合璧的管弦篇章',
  other:'土族生活影像 · 安昭、轮子秋与婚礼记录',
};

/* ================= 启动 ================= */
async function loadLibrary(){
  try{
    const r = await fetch('/api/playlist', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({platform:'ethnos', id:'e28'}) });
    const d = await r.json();
    if(d && d.tracks && d.tracks.length){ SONGS = d.tracks; SID = d.sid; }
  }catch(e){}
  buildSidebar();
  renderHome();
}
$('#logo-sun').innerHTML = logoSun();
setInterval(()=>{ const c=document.querySelector('#content .carousel'); if(c && !c.matches(':hover')){ slideIdx=(slideIdx+1)%SLIDES.length; paintSlide(); } },4000);
loadLibrary();
</script>
</body>
</html>
