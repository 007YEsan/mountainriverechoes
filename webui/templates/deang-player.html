<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1a24">
<title>德昂回响 · 德昂族民族音乐</title>
<style>
/* ============================================================
   德昂回响 —— 德昂族民族音乐播放器
   设计系统：德昂族母题（水鼓·藤篾腰箍·茶树）抽象化
   配色：水青 / 靛蓝 / 鼓木棕 / 藤篾红黑 / 银白
   ============================================================ */
:root{
  --bg:#0d1a24;            /* 深底 · 靛蓝近黑 */
  --bg-raise:#122432;      /* 抬升面板 */
  --bg-card:#162b3c;       /* 卡片 */
  --line:#22374a;          /* 分隔线 */
  --line-soft:#1b2e3e;

  --water:#5fb8b0;         /* 水青 · 主色 */
  --water-dim:#3f8f89;
  --indigo:#4f82b8;        /* 靛蓝 */
  --indigo-deep:#2e5b8a;
  --wood:#9a6a46;          /* 鼓木棕 */
  --wood-dim:#7a5230;
  --vine:#a34444;          /* 藤篾红 */
  --vine-deep:#7a2e2e;
  --silver:#e8e6df;        /* 银白 · 主文字 */
  --silver-dim:#9fb0bd;    /* 次级文字 */
  --silver-faint:#5f7180;  /* 弱文字 */

  --radius:16px;
  --radius-sm:11px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);

  --font-title:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--silver);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:filter .4s ease;
}
body.reduced *{transition:none!important;animation:none!important;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}

/* ---------- 应用骨架 ---------- */
.app{
  max-width:520px;
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.viewport{
  flex:1;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  scrollbar-width:none;
}
.viewport::-webkit-scrollbar{display:none;}

/* ---------- 页面切换 ---------- */
.page{display:none;padding:0 20px;padding-top:14px;}
.page.active{display:block;animation:pageIn .32s ease;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---------- 顶部栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0 14px;
}
.topbar .brand{
  display:flex;align-items:center;gap:10px;
}
.brand .seal{
  width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--water);
  position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.brand .seal::before{
  content:'';width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--water-dim);
}
.brand .seal::after{
  content:'';position:absolute;inset:3px;border-radius:50%;
  border:1px solid var(--water-dim);opacity:.5;
}
.brand .seal span{
  width:5px;height:5px;border-radius:50%;background:var(--vine);
  position:absolute;
}
.brand .title{font-family:var(--font-title);font-size:19px;letter-spacing:2px;font-weight:600;}
.brand .title em{font-style:normal;color:var(--water);}
.brand .sub{font-size:11px;color:var(--silver-faint);letter-spacing:1px;margin-top:1px;}
.topbar .gear{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--silver-dim);
}

/* ---------- 首页 ---------- */
.hero{
  position:relative;
  border-radius:var(--radius);
  background:var(--bg-card);
  overflow:hidden;
  padding:22px 20px 20px;
  margin-bottom:18px;
  border:1px solid var(--line);
}
.hero .ripple{
  position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;border:1px solid rgba(95,184,176,.18);
}
.hero .ripple.r2{right:-10px;top:-10px;width:120px;height:120px;border-color:rgba(95,184,176,.12);}
.hero .ripple.r3{right:20px;top:20px;width:60px;height:60px;border-color:rgba(79,130,184,.2);}
.hero .eyebrow{font-size:12px;letter-spacing:3px;color:var(--water);margin-bottom:6px;}
.hero h1{
  font-family:var(--font-title);font-size:26px;font-weight:600;
  letter-spacing:2px;margin:0 0 8px;line-height:1.35;
}
.hero .desc{font-size:13px;color:var(--silver-dim);max-width:300px;margin:0 0 18px;}
.hero .playall{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--water);color:#08201d;
  font-weight:600;font-size:14px;
  padding:11px 22px;border-radius:24px;
  position:relative;z-index:1;
}
.hero .playall:active{background:var(--water-dim);}
.hero .meta{position:relative;z-index:1;margin-top:16px;font-size:12px;color:var(--silver-faint);}

.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:22px 0 12px;
}
.section-head h2{
  font-family:var(--font-title);font-size:17px;font-weight:600;
  letter-spacing:1px;margin:0;display:flex;align-items:center;gap:8px;
}
.section-head h2::before{
  content:'';width:4px;height:16px;background:var(--vine);
  border-radius:2px;
}
.section-head .more{font-size:12px;color:var(--silver-faint);}

/* 歌曲列表 */
.tracklist{display:flex;flex-direction:column;}
.track{
  display:flex;align-items:center;gap:12px;
  padding:11px 8px;border-radius:var(--radius-sm);
  min-height:56px;
}
.track:active{background:var(--bg-card);}
.track .idx{width:22px;text-align:center;font-size:13px;color:var(--silver-faint);flex-shrink:0;}
.track .cover{
  width:46px;height:46px;border-radius:10px;flex-shrink:0;
  background:var(--bg-card);overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.track .cover img{width:100%;height:100%;object-fit:cover;}
.track .cover .leaf{
  width:20px;height:26px;flex-shrink:0;
}
.track .info{flex:1;min-width:0;}
.track .nm{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track .ar{font-size:12px;color:var(--silver-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.track .src{
  font-size:10px;color:var(--silver-faint);flex-shrink:0;
  border:1px solid var(--line);border-radius:8px;padding:2px 7px;
}
.track.playing .nm{color:var(--water);}
.track.playing .idx{color:var(--water);}

/* 轮播封面卡 */
.featured{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;}
.featured::-webkit-scrollbar{display:none;}
.fcard{
  flex:0 0 120px;scroll-snap-align:start;
  border-radius:var(--radius-sm);overflow:hidden;
  background:var(--bg-card);border:1px solid var(--line);
}
.fcard .img{width:120px;height:120px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;}
.fcard .img img{width:100%;height:100%;object-fit:cover;}
.fcard .cap{padding:8px 10px;font-size:12px;color:var(--silver-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- 播放页 ---------- */
.nowpage{display:flex;flex-direction:column;align-items:center;padding-top:8px;}
.art-wrap{
  position:relative;width:min(78vw,300px);aspect-ratio:1;
  margin:12px 0 26px;
}
.art-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:1px solid var(--line-soft);
}
.art-ring.ring2{inset:-20px;border:1px dashed rgba(95,184,176,.25);}
.art{
  position:absolute;inset:0;border-radius:50%;
  background:var(--bg-card);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px var(--bg-raise),0 0 0 7px var(--line);
}
.art img{width:100%;height:100%;object-fit:cover;}
.art .bigleaf{width:42%;height:auto;opacity:.9;}
.art.spinning img{animation:spin 22s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
body.reduced .art.spinning img{animation:none;}

.now-info{text-align:center;width:100%;padding:0 8px;}
.now-title{font-family:var(--font-title);font-size:21px;font-weight:600;letter-spacing:1px;margin:0 0 6px;line-height:1.4;}
.now-artist{font-size:13px;color:var(--silver-dim);margin:0;}
.now-src{font-size:11px;color:var(--silver-faint);margin-top:4px;}

/* 进度条 */
.progress{margin:26px 0 6px;width:100%;}
.timeline{display:flex;justify-content:space-between;font-size:11px;color:var(--silver-faint);margin-bottom:8px;}
.timeline .t{font-variant-numeric:tabular-nums;}
.seekbar{
  position:relative;height:5px;border-radius:3px;background:var(--line);
  cursor:pointer;
}
.seekbar .fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  border-radius:3px;background:linear-gradient(90deg,var(--water),var(--indigo));
}
.seekbar .knob{
  position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
  background:var(--silver);transform:translate(-50%,-50%);left:0%;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}

/* 控制区 */
.controls{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;margin:18px 0 6px;
}
.ctrl-btn{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--silver-dim);
}
.ctrl-btn:active{background:var(--bg-card);}
.ctrl-btn.small{width:46px;height:46px;}
.play-btn{
  width:76px;height:76px;border-radius:50%;
  background:var(--vine);
  display:flex;align-items:center;justify-content:center;
  color:#fff;position:relative;
  box-shadow:0 6px 20px rgba(122,46,46,.45);
}
.play-btn:active{background:var(--vine-deep);transform:scale(.97);}
.play-btn::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(163,68,68,.35);
}
.play-btn.playing{background:var(--water);color:#08201d;box-shadow:0 6px 20px rgba(63,143,137,.4);}
.play-btn.playing::before{border-color:rgba(95,184,176,.3);}

/* 模式切换 */
.mode-row{
  display:flex;justify-content:center;gap:20px;margin-top:14px;
  font-size:12px;color:var(--silver-faint);
}
.mode-row .m{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:12px;}
.mode-row .m.on{color:var(--water);}

/* ---------- 歌词页 ---------- */
.lyricpage{padding-top:6px;}
.lyricpage .top{
  position:relative;text-align:center;padding:10px 0 4px;margin-bottom:16px;
}
.lyricpage .top .bands{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:180px;height:40px;opacity:.5;
}
.lyricpage .top .bands div{
  position:absolute;border:1px solid var(--vine);border-radius:50%;
  width:180px;height:40px;left:0;
}
.lyricpage .top .bands div:nth-child(2){transform:translateY(-6px);border-color:var(--water);opacity:.6;}
.lyricpage .top .bands div:nth-child(3){transform:translateY(6px);border-color:var(--wood);opacity:.6;}
.lyricpage .top h2{font-family:var(--font-title);font-size:19px;font-weight:600;letter-spacing:1px;margin:0;position:relative;z-index:1;}
.lyric-scroll{
  height:calc(100dvh - 320px);overflow-y:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,black 12%,black 88%,transparent);
  mask-image:linear-gradient(transparent,black 12%,black 88%,transparent);
  padding:20px 4px;
}
.lyric-scroll::-webkit-scrollbar{display:none;}
.l-line{
  text-align:center;font-size:16px;color:var(--silver-dim);
  padding:9px 0;line-height:1.7;
  font-family:var(--font-title);letter-spacing:1px;
  transition:color .3s,font-size .3s;
}
.l-line.cur{color:var(--silver);font-size:19px;font-weight:600;}
.l-empty{text-align:center;color:var(--silver-faint);font-size:13px;padding:60px 0;}

/* ---------- 底部导航 ---------- */
.navbar{
  position:fixed;bottom:0;left:0;right:0;
  max-width:520px;margin:0 auto;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(13,26,36,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;z-index:50;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--silver-faint);position:relative;min-height:44px;
}
.nav-item .ic{width:22px;height:22px;}
.nav-item span{font-size:10.5px;letter-spacing:1px;}
.nav-item.on{color:var(--water);}
.nav-item.on::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2px;border-radius:1px;background:var(--water);
}
.nav-item.on .ic{filter:none;}

/* ---------- 迷你播放条 ---------- */
.miniplayer{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b));left:0;right:0;
  max-width:520px;margin:0 auto;z-index:49;
}
.mini-inner{
  margin:0 12px 8px;border-radius:13px;
  background:var(--bg-raise);border:1px solid var(--line);
  display:flex;align-items:center;gap:11px;padding:9px 12px;
  box-shadow:0 4px 18px rgba(0,0,0,.4);
}
.mini-inner .mcover{
  width:40px;height:40px;border-radius:9px;overflow:hidden;
  background:var(--bg-card);flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.mini-inner .mcover img{width:100%;height:100%;object-fit:cover;}
.mini-inner .minfo{flex:1;min-width:0;}
.mini-inner .mnm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-inner .mar{font-size:11px;color:var(--silver-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-inner .mbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--water);flex-shrink:0;}

/* ---------- 设置抽屉 ---------- */
.drawer-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;
}
.drawer-mask.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:91;
  background:var(--bg-raise);border-radius:20px 20px 0 0;
  padding:22px 22px calc(24px + var(--safe-b));
  transform:translateY(100%);transition:transform .32s ease;
}
.drawer.show{transform:translateY(0);}
.drawer .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px;}
.drawer h3{font-family:var(--font-title);font-size:17px;font-weight:600;margin:0 0 16px;letter-spacing:1px;}
.set-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--line-soft);
}
.set-row:last-child{border-bottom:none;}
.set-row .lbl{font-size:14px;}
.set-row .lbl small{display:block;font-size:11px;color:var(--silver-faint);margin-top:2px;}
.switch{
  width:50px;height:30px;border-radius:15px;background:var(--line);
  position:relative;transition:background .25s;flex-shrink:0;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:var(--silver);transition:left .25s;
}
.switch.on{background:var(--water);}
.switch.on::after{left:23px;}

/* ---------- toast ---------- */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:var(--bg-card);border:1px solid var(--line);
  padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}

/* 加载态 */
.spinner{
  width:34px;height:34px;border-radius:50%;margin:50px auto;
  border:3px solid var(--line);border-top-color:var(--water);
  animation:spin 1s linear infinite;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
</style>
</head>

<div class="app">

  <!-- 视图容器 -->
  <div class="viewport" id="viewport">

    <!-- ============ 首页 ============ -->
    <section class="page active" id="page-home" aria-label="首页">
      <div class="topbar">
        <div class="brand">
          <div class="seal"><span></span></div>
          <div>

        </button>
      </div>

      <div class="hero">
        <div class="ripple"></div><div class="ripple r2"></div><div class="ripple r3"></div>

        </button>
        <div class="meta" id="hero-meta">加载中…</div>
      </div>

      <div class="section-head"><h2>正在聆听</h2></div>

        <div class="spinner" id="home-loading"></div>
      </div>

      <div class="section-head"><h2>精选曲目</h2><span class="more">点击播放</span></div>
      <div class="tracklist" id="featured-list"></div>
    </section>

    <!-- ============ 播放页 ============ -->
    <section class="page" id="page-now" aria-label="播放页">
      <div class="nowpage">
        <div class="art-wrap">
          <div class="art-ring"></div>
          <div class="art-ring ring2"></div>
          <div class="art" id="now-art">
            <svg class="bigleaf" id="now-leaf" viewBox="0 0 40 52" fill="none">
              <path d="M20 2 C32 12 36 24 30 38 C26 46 14 50 8 46 C4 42 6 34 12 34 C16 34 18 38 20 42 C22 38 26 30 28 22 C22 26 14 24 10 18 C16 16 20 8 20 2 Z" fill="#7a2e2e" opacity=".85"/>
              <path d="M20 6 L20 44" stroke="#e8e6df" stroke-width="1" opacity=".5"/>
            </svg>
          </div>
        </div>
        <div class="now-info">
          <h1 class="now-title" id="now-title">—</h1>
          <p class="now-artist" id="now-artist">—</p>
          <p class="now-src" id="now-src">—</p>
        </div>
        <div class="progress">
          <div class="seekbar" id="seekbar" role="slider" aria-label="播放进度" tabindex="0">
            <div class="fill" id="seek-fill"></div>
            <div class="knob" id="seek-knob"></div>

          <div class="timeline">
            <span class="t" id="t-cur">00:00</span>
            <span class="t" id="t-dur">00:00</span>
          </div>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="btn-mode" aria-label="播放模式">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 3l4 4-4 4M21 7H7"/><path d="M7 21l-4-4 4-4M3 17h14"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-prev" aria-label="上一首">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-9 6 9 6z"/></svg>
          </button>
          <button class="play-btn" id="btn-play" aria-label="播放/暂停">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" id="play-ic"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-next" aria-label="下一首">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-like" aria-label="收藏">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>
        <div class="mode-row">
          <span class="m" id="mode-label"></span>
        </div>
      </div>
    </section>

    <!-- ============ 歌词页 ============ -->
    <section class="page" id="page-lyric" aria-label="歌词页">
      <div class="lyricpage">
        <div class="top">
          <div class="bands"><div></div><div></div><div></div></div>
          <h2 id="lyric-song-title">歌词</h2>
        </div>
        <div class="lyric-scroll" id="lyric-scroll">
          <div class="l-empty">暂无歌词</div>
        </div>
      </div>
    </section>

  </div>

  <!-- ============ 迷你播放条 ============ -->
  <div class="miniplayer" id="miniplayer" style="display:none;">
    <div class="mini-inner" id="mini-inner">
      <div class="mcover" id="mini-cover">
        <svg viewBox="0 0 40 52" width="20" height="26"><path d="M20 2 C32 12 36 24 30 38 C26 46 14 50 8 46 C4 42 6 34 12 34 C16 34 18 38 20 42 C22 38 26 30 28 22 C22 26 14 24 10 18 C16 16 20 8 20 2 Z" fill="#7a2e2e"/></svg>
      </div>
      <div class="minfo">
        <div class="mnm" id="mini-name">—</div>
        <div class="mar" id="mini-artist">—</div>
      </div>
      <button class="mbtn" id="mini-play" aria-label="播放/暂停">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- ============ 底部导航 ============ -->
  <nav class="navbar" aria-label="底部导航">
    <button class="nav-item on" data-page="home" aria-label="首页">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" data-page="lyric" aria-label="歌词">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16M4 12h10M4 19h16"/></svg>
      <span>歌词</span>
    </button>
    <button class="nav-item" data-page="now" aria-label="正在播放">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>
      <span>播放</span>
    </button>
  </nav>

  <!-- ============ 设置抽屉 ============ -->
  <div class="drawer-mask" id="drawer-mask"></div>
  <div class="drawer" id="drawer">
    <div class="handle"></div>
    <h3>设置</h3>
    <div class="set-row">
      <div class="lbl">柔和动效<small>减少旋转与过渡动画</small></div>
      <button class="switch" id="sw-motion" role="switch" aria-checked="false"></button>
    </div>
    <div class="set-row">
      <div class="lbl">深色模式<small>本界面固定为深色</small></div>
      <button class="switch on" id="sw-dark" role="switch" aria-checked="true"></button>
    </div>
    <div class="set-row">
      <div class="lbl" id="cache-lbl">曲目缓存<small id="cache-sub">尚未加载</small></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   德昂回响 · 逻辑层
   数据源：山河回响后端 /api/playlist (ethnos:e44)
   ============================================================ */
(function(){
  'use strict';
  var API = {
    playlist: '/api/playlist',
    preview: '/api/preview',
    cover: '/api/cover',
    lyric: '/api/lyric'
  };
  var GROUP = 'e44';
  var COVER = '';

  var state = {
    tracks: [],          // 曲目列表 [{song_name,singers,duration,cover_url,sid,id,source,ext}]
    sid: null,
    index: -1,           // 当前播放索引
    playing: false,
    mode: 0,             // 0 顺序 1 循环 2 单曲
    audio: new Audio(),
    liked: new Set(),
    motion: false,       // 柔和动效（true=减少）
    lyricLines: [],
    lyricCur: -1
  };
  var MODE_LABEL = ['顺序播放','列表循环','单曲循环'];
  var MODE_ICON = [
    '<path d="M17 3l4 4-4 4M21 7H7"/><path d="M7 21l-4-4 4-4M3 17h14"/>',
    '<path d="M17 3l4 4-4 4M21 7H7"/><path d="M7 21l-4-4 4-4M3 17h14"/>',
    '<path d="M12 4v2m0 12v2M4.9 5.9l1.4 1.4m11.4 11.4l1.4 1.4M4 12h2m12 0h2M4.9 18.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
  ];

  function $(s){ return document.querySelector(s); }
  function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(sec){
    sec = Math.max(0, Math.floor(sec||0));
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){t.classList.remove('show');}, 2200);
  }
  function post(url, data){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();});
  }
  function getCoverUrl(u){
    if(!u) return '';
    return API.cover + '?url=' + encodeURIComponent(u);
  }
  function leafSvg(){
    return '<svg class="leaf" viewBox="0 0 40 52" fill="none"><path d="M20 2 C32 12 36 24 30 38 C26 46 14 50 8 46 C4 42 6 34 12 34 C16 34 18 38 20 42 C22 38 26 30 28 22 C22 26 14 24 10 18 C16 16 20 8 20 2 Z" fill="#7a2e2e" opacity=".85"/><path d="M20 6 L20 44" stroke="#e8e6df" stroke-width="1" opacity=".5"/></svg>';
  }

  /* ---------- 数据加载 ---------- */
  function loadTracks(){
    return post(API.playlist, {platform:'ethnos', id:GROUP}).then(function(d){
      if(d && d.tracks && d.tracks.length){
        state.tracks = d.tracks;
        state.sid = d.sid || (d.tracks[0] && d.tracks[0].sid) || null;
        COVER = d.cover || '';
      }
      return d;
    });
  }

  function srcShort(src){
    var m = {'Weixin':'微信','光音·微信':'光音','Bilibili':'B站','Kuwo':'酷我','Kugou':'酷狗','MyFreeMP3':'网络','Netease':'网易云','QQ':'QQ音乐'};
    return m[src] || src || '';
  }

  /* ---------- 渲染 ---------- */
  function renderHome(){
    $('#home-loading').style.display = 'none';
    $('#hero-meta').textContent = state.tracks.length + ' 首曲目 · 德昂族音乐库';
    // 正在聆听：前 6 首
    var recent = state.tracks.slice(0,6);
    $('#recent-list').innerHTML = recent.map(function(t,i){
      return trackRow(t,i);
    }).join('');
    // 精选：有封面的前 8 首
    var featured = state.tracks.filter(function(t){return t.cover_url;}).slice(0,8);
    var list = featured.length ? featured : state.tracks.slice(0,8);
    $('#featured-list').innerHTML = list.map(function(t){
      var gi = state.tracks.indexOf(t);
      return trackRow(t, gi);
    }).join('');
    bindTrackRows();
    updateMini();
  }

  function trackRow(t, i){
    var cov = getCoverUrl(t.cover_url);
    var img = cov ? '<img src="'+esc(cov)+'" alt="" loading="lazy">' : leafSvg();
    var playing = (i === state.index) ? ' playing' : '';
    return '<div class="track'+playing+'" data-i="'+i+'">'
      + '<div class="idx">'+(i+1)+'</div>'
      + '<div class="cover">'+img+'</div>'
      + '<div class="info"><div class="nm">'+esc(t.song_name||'未命名')+'</div>'
      + '<div class="ar">'+esc(t.singers||'未知歌手')+'</div></div>'
      + '<div class="src">'+esc(srcShort(t.source))+'</div>'
      + '</div>';
  }

  function bindTrackRows(){
    $$('#recent-list .track, #featured-list .track').forEach(function(el){
      el.onclick = function(){
        var i = parseInt(el.dataset.i,10);
        playAt(i);
      };
    });
  }

  /* ---------- 播放控制 ---------- */
  function playAt(i){
    if(i < 0 || i >= state.tracks.length) return;
    state.index = i;
    var t = state.tracks[i];
    // 更新 UI
    $('#now-title').textContent = t.song_name || '未命名';
    $('#now-artist').textContent = (t.singers || '未知歌手');
    $('#now-src').textContent = srcShort(t.source) + (t.duration ? ' · '+t.duration : '');
    var cov = getCoverUrl(t.cover_url);
    var art = $('#now-art');
    art.innerHTML = cov ? '<img src="'+esc(cov)+'" alt="">' : leafSvg();
    // 播放
    loadAndPlay(t);
    renderHome();
    updateNavPlaying();
  }

  function previewUrl(t){
    var u = API.preview + '?sid=' + encodeURIComponent(t.sid || state.sid || '')
      + '&id=' + encodeURIComponent(t.id || '')
      + '&n=' + encodeURIComponent(t.song_name || '')
      + '&s=' + encodeURIComponent(t.singers || '')
      + '&src=' + encodeURIComponent(t.source || '');
    return u;
  }

  function loadAndPlay(t){
    var src = previewUrl(t);
    state.audio.src = src;
    state.audio.play().then(function(){
      setPlaying(true);
      loadLyric(t);
    }).catch(function(err){
      toast('无法播放：'+ (err && err.message ? err.message : '链接失效'));
      setPlaying(false);
    });
  }

  function setPlaying(p){
    state.playing = p;
    var btn = $('#btn-play');
    var ic = $('#play-ic');
    if(p){
      btn.classList.add('playing');
      ic.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    }else{
      btn.classList.remove('playing');
      ic.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
    updateMini();
  }

  function togglePlay(){
    var t = state.tracks[state.index];
    if(!t){ if(state.tracks.length) playAt(0); return; }
    if(state.playing){
      state.audio.pause(); setPlaying(false);
    }else{
      state.audio.play().then(function(){setPlaying(true);}).catch(function(){ loadAndPlay(t); });
    }
  }

  function next(){ step(1); }
  function prev(){ step(-1); }
  function step(d){
    var n = state.tracks.length;
    if(!n) return;
    var i = state.index + d;
    if(i >= n) i = 0;
    if(i < 0) i = n-1;
    playAt(i);
  }

  function onEnded(){
    if(state.mode === 2){ // 单曲循环
      state.audio.currentTime = 0; state.audio.play();
      return;
    }
    if(state.mode === 1){ // 列表循环
      next(); return;
    }
    // 顺序：到最后停下
    if(state.index >= state.tracks.length - 1){ setPlaying(false); return; }
    next();
  }

  /* ---------- 歌词 ---------- */
  function loadLyric(t){
    state.lyricLines = []; state.lyricCur = -1;
    $('#lyric-scroll').innerHTML = '<div class="l-empty">歌词加载中…</div>';
    post(API.lyric, {sid:t.sid||state.sid, id:t.id, name:t.song_name, artist:t.singers}).then(function(d){
      var txt = d && (d.lyric || d.lrc || '');
      if(txt){
        var lines = parseLrc(txt);
        if(lines.length){
          state.lyricLines = lines;
          $('#lyric-song-title').textContent = t.song_name || '歌词';
          $('#lyric-scroll').innerHTML = lines.map(function(l,i){
            return '<div class="l-line" data-i="'+i+'">'+esc(l.txt)+'</div>';
          }).join('');
          return;
        }
      }
      $('#lyric-scroll').innerHTML = '<div class="l-empty">这首曲目暂无歌词<br>（民间口头音乐，多靠口耳相传）</div>';
    }).catch(function(){
      $('#lyric-scroll').innerHTML = '<div class="l-empty">歌词获取失败</div>';
    });
  }

  function parseLrc(raw){
    var re = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
    var out = [];
    raw.split(/\r?\n/).forEach(function(line){
      var m, times = [];
      var re2 = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
      while((m = re2.exec(line))){
        var min = parseInt(m[1],10), sec = parseInt(m[2],10);
        var ms = m[3] ? parseInt(m[3].padEnd(3,'0'),10) : 0;
        times.push(min*60 + sec + ms/1000);
      }
      var txt = line.replace(/\[[^\]]*\]/g,'').trim();
      if(!txt) return;
      if(times.length === 0){ out.push({t:-1, txt:txt}); }
      else { times.forEach(function(t){ out.push({t:t, txt:txt}); }); }
    });
    out.sort(function(a,b){return a.t-b.t;});
    return out;
  }

  function updateLyric(){
    if(!state.lyricLines.length) return;
    var ct = state.audio.currentTime;
    var cur = -1;
    for(var i=0;i<state.lyricLines.length;i++){
      if(state.lyricLines[i].t <= ct) cur = i; else break;
    }
    if(cur === state.lyricCur) return;
    state.lyricCur = cur;
    $$('#lyric-scroll .l-line').forEach(function(el,i){
      el.classList.toggle('cur', i === cur);
    });
    if(cur >= 0){
      var el = $('#lyric-scroll .l-line[data-i="'+cur+'"]');
      if(el && el.offsetTop){
        $('#lyric-scroll').scrollTo({top: el.offsetTop - 120, behavior: state.motion ? 'auto':'smooth'});
      }
    }
  }

  /* ---------- 进度 ---------- */
  function updateProgress(){
    var a = state.audio;
    var dur = a.duration;
    $('#t-cur').textContent = fmt(a.currentTime);
    if(dur && isFinite(dur)){
      $('#t-dur').textContent = fmt(dur);
      var pct = dur ? (a.currentTime/dur*100) : 0;
      $('#seek-fill').style.width = pct + '%';
      $('#seek-knob').style.left = pct + '%';
    }
  }

  function seekTo(clientX){
    var bar = $('#seekbar');
    var r = bar.getBoundingClientRect();
    var pct = (clientX - r.left) / r.width;
    pct = Math.max(0, Math.min(1, pct));
    var a = state.audio;
    if(a.duration && isFinite(a.duration)){
      a.currentTime = pct * a.duration;
    }
  }

  /* ---------- 迷你条 ---------- */
  function updateMini(){
    var t = state.tracks[state.index];
    var mp = $('#miniplayer');
    if(!t || state.index < 0){ mp.style.display = 'none'; return; }
    mp.style.display = 'block';
    $('#mini-name').textContent = t.song_name || '未命名';
    $('#mini-artist').textContent = (t.singers || '未知歌手');
    var cov = getCoverUrl(t.cover_url);
    var mc = $('#mini-cover');
    mc.innerHTML = cov ? '<img src="'+esc(cov)+'" alt="">' : leafSvg().replace('class="leaf"','');
    $('#mini-play').innerHTML = state.playing
      ? '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }

  function updateNavPlaying(){
    $$('.track').forEach(function(el){
      var i = parseInt(el.dataset.i,10);
      el.classList.toggle('playing', i === state.index);
    });
  }

  /* ---------- 页面切换 ---------- */
  function switchPage(name){
    $$('.page').forEach(function(p){ p.classList.remove('active'); });
    $('#page-'+name).classList.add('active');
    $$('.nav-item').forEach(function(n){ n.classList.toggle('on', n.dataset.page === name); });
    $('#viewport').scrollTop = 0;
  }

  /* ---------- 事件绑定 ---------- */
  function bind(){
    // 导航
    $$('.nav-item').forEach(function(n){
      n.onclick = function(){ switchPage(n.dataset.page); };
    });
    // 首页播全部
    $('#btn-playall').onclick = function(){ playAt(0); switchPage('now'); };
    // 播放控制
    $('#btn-play').onclick = togglePlay;
    $('#btn-next').onclick = next;
    $('#btn-prev').onclick = prev;
    $('#btn-mode').onclick = function(){
      state.mode = (state.mode+1)%3;
      $('#mode-label').textContent = MODE_LABEL[state.mode];
      $('#btn-mode').innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6">'+MODE_ICON[state.mode]+'</svg>';
      toast(MODE_LABEL[state.mode]);
    };
    $('#mode-label').textContent = MODE_LABEL[0];
    $('#btn-like').onclick = function(){
      var t = state.tracks[state.index];
      if(!t) return;
      var k = t.song_name+'|'+t.singers;
      if(state.liked.has(k)){ state.liked.delete(k); toast('已取消收藏'); }
      else { state.liked.add(k); toast('已收藏'); }
    };
    // 迷你条
    $('#mini-play').onclick = function(e){ e.stopPropagation(); togglePlay(); };
    $('#mini-inner').onclick = function(){ switchPage('now'); };
    // 进度条
    var seekbar = $('#seekbar');
    seekbar.addEventListener('click', function(e){ seekTo(e.clientX); });
    seekbar.addEventListener('keydown', function(e){
      if(e.key==='ArrowRight'){ state.audio.currentTime += 5; }
      if(e.key==='ArrowLeft'){ state.audio.currentTime -= 5; }
    });
    // 音频事件
    state.audio.addEventListener('timeupdate', function(){ updateProgress(); updateLyric(); });
    state.audio.addEventListener('loadedmetadata', updateProgress);
    state.audio.addEventListener('ended', onEnded);
    state.audio.addEventListener('error', function(){
      toast('播放出错，直链可能已过期');
      setPlaying(false);
    });
    // 设置抽屉
    $('#btn-gear').onclick = function(){
      $('#drawer').classList.add('show');
      $('#drawer-mask').classList.add('show');
    };
    $('#drawer-mask').onclick = closeDrawer;
    $('#sw-motion').onclick = function(){
      state.motion = !state.motion;
      $('#sw-motion').classList.toggle('on', state.motion);
      $('#sw-motion').setAttribute('aria-checked', state.motion);
      document.body.classList.toggle('reduced', state.motion);
      $('#now-art').classList.toggle('spinning', !state.motion && state.playing);
    };
    $('#sw-dark').onclick = function(){ toast('深色模式为本界面固定风格'); };
  }
  function closeDrawer(){
    $('#drawer').classList.remove('show');
    $('#drawer-mask').classList.remove('show');
  }

  /* ---------- 启动 ---------- */
  function init(){
    bind();
    $('#cache-lbl').style.display = 'none'; // 简化：移除缓存行避免误导
    loadTracks().then(function(d){
      if(d && d.building){ toast('曲库正在构建，稍候自动刷新…'); }
      renderHome();
    }).catch(function(err){
      $('#home-loading').style.display = 'none';
      $('#hero-meta').textContent = '加载失败，请确认后端服务已启动';
      toast('无法连接曲库服务');
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }
})();
</script>
</body>
</html>
