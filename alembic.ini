# Alembic 配置 —— 开发期 schema 版本化工具, 不进 exe 打包产物。
#
# sqlalchemy.url 故意留空: 真实地址由 migrations/env.py 从
# app.config.load_settings().db_path 推导, 这样 MRE_DB_PATH / MRE_DATA_DIR
# 对 alembic 与运行时完全同效, 也不会有人把本机绝对路径提交进仓库。
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
